name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        env:
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_GOOGLE_REMARKETING_ID: ${{ secrets.PUBLIC_GOOGLE_REMARKETING_ID }}
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ secrets.PUBLIC_YANDEX_METRIKA_ID }}
        run: pnpm run build

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          REMOTE_PORT: ${{ secrets.CPANEL_PORT }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.CPANEL_APP_DIR }}
          EXCLUDE: "/.git/"
          SCRIPT_AFTER: |
            echo "Deployment completed"
            PM2_HOME=/var/www/h10137/data/.pm2 /usr/lib/ispnodejs/bin/node /usr/lib/ispnodejs/bin/pm2 restart stellazhi.by
